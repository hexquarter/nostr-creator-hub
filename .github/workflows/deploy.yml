name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deploy at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Lint
        run: yarn lint

      # Project sites live under /<repo>/, user sites and custom domains at the root.
      - name: Resolve base path
        id: base
        run: |
          if [[ -f CNAME || "$GITHUB_REPOSITORY" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: ${{ steps.base.outputs.path }}
          # Set these as repository variables (Settings → Secrets and variables →
          # Actions → Variables). Empty values keep the placeholder checkout.
          VITE_CRAYS_LIGHTNING_ADDRESS: ${{ vars.CRAYS_LIGHTNING_ADDRESS }}
        run: yarn build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
